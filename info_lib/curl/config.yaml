language: c

# 编译链接配置
compile_config:
  sanitize_library: "./test_lib/curl/build_sanitize/libcurl_complete.a"
  analysis_library: "./test_lib/curl/build_analysis/shared/lib/libcurl.so"  # For API extraction
  coverage_library: "./test_lib/curl/build_coverage/libcurl_complete.a"
