language: c

compile_config:
  sanitize_library: "./test_lib/cJSON/build_sanitize/libcjson_trace2fuzz.a"
  analysis_library: "./test_lib/cJSON/build_analysis/libcjson_trace2fuzz.so"
  coverage_library: "./test_lib/cJSON/build_coverage/libcjson_trace2fuzz.a"
